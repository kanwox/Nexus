name: Nexus Build & Auto Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # detekt is configured with maxIssues: 0, so this gate is meaningful.
      - name: Static analysis (detekt)
        run: ./gradlew detekt --no-configuration-cache

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-configuration-cache

      # Restores the release keystore from the repository secrets. When the secret is absent the
      # workflow falls back to a debug build so the pipeline never produces an unsigned APK.
      - name: Restore signing keystore
        env:
          RELEASE_STORE_BASE64: ${{ secrets.RELEASE_STORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_STORE_BASE64" ]; then
            echo "$RELEASE_STORE_BASE64" | base64 -d > "$RUNNER_TEMP/nexus-release.jks"
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/nexus-release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"
            echo "Release signing configured."
          else
            echo "SIGNING_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "::warning::RELEASE_STORE_BASE64 is not set; falling back to a debug build."
          fi

      - name: Build signed Release APK
        if: env.SIGNING_CONFIGURED == 'true'
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Debug APK (fallback)
        if: env.SIGNING_CONFIGURED != 'true'
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build_output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build_output/Nexus-arm64-v8a-release.apk
          elif [ -f app/build/outputs/apk/release/nexus-release.apk ]; then
            cp app/build/outputs/apk/release/nexus-release.apk build_output/Nexus-arm64-v8a-release.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build_output/Nexus-arm64-v8a-debug.apk
          elif [ -f app/build/outputs/apk/debug/nexus-debug.apk ]; then
            cp app/build/outputs/apk/debug/nexus-debug.apk build_output/Nexus-arm64-v8a-debug.apk
          else
            find app/build/outputs/apk -name "*.apk" -exec cp {} build_output/ \;
          fi
          ls -lh build_output

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-arm64-v8a-apk
          path: build_output/*.apk

      - name: Extract App Version
        id: get_version
        run: |
          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION_NAME}"
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=Nexus $TAG" >> "$GITHUB_ENV"

      # Publishes a new release corresponding to the version tag (e.g. v1.0.1-Beta.2)
      - name: Publish Automatic Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body: |
            ### Nexus Automated Cloud Build
            - Version: ${{ env.VERSION_NAME }}
            - Core: Mihomo ARM64 (libclash.so & libbridge.so)
            - ABI: arm64-v8a only
            - APK: download below and install directly on a 64-bit ARM Android device.
          draft: false
          prerelease: false
          files: build_output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
