name: Nexus Build & Auto Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # detekt fails the build on any issue (ignoreFailures = false in app/build.gradle.kts),
      # so this gate is meaningful.
      - name: Static analysis (detekt)
        run: ./gradlew detekt --no-configuration-cache

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-configuration-cache

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build_output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build_output/Nexus-arm64-v8a-release.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build_output/Nexus-arm64-v8a-debug.apk
          else
            find app/build/outputs/apk -name "*.apk" -exec cp {} build_output/ \;
          fi
          ls -lh build_output

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-arm64-v8a-apk
          path: build_output/*.apk

      - name: Extract App Version
        id: get_version
        run: |
          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION_NAME}"
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=Nexus $TAG" >> "$GITHUB_ENV"
          # Any tag carrying a pre-release marker is published as a GitHub pre-release.
          if echo "$TAG" | grep -qiE -- '-(alpha|beta|rc|preview|canary|dev)([.#0-9-]|$)'; then
            echo "RELEASE_IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      # Publishes the APK as a GitHub release for the version tag. Tags with a pre-release
      # marker (v1.0.4-Alpha.1, v1.0.1-Beta.2, v2.0.0-RC1, …) are marked as pre-releases.
      - name: Publish Automatic Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body: |
            ### Changes in v1.0.4

            v1.0.4 is a major stability, security and polish release over v1.0.3.

            #### Security
            - Pinned SHA-256 fingerprints for config rewrite scripts. Scripts are verified before auto-execution and skipped with a warning if their content no longer matches what was saved.
            - Replaced the unmaintained QuickJS engine with quickjs-kt: script timeouts are enforced by a native interrupt handler, so an infinite-loop script is terminated cleanly instead of leaking a spinning thread and unbounded memory. All common script styles (`function main`, `module.exports =`, arrow functions) are covered by engine tests.
            - Subscription and script URLs are redacted in logs and error messages (tokens stripped); link-local (cloud metadata) targets are rejected.
            - Subscription and script downloads are size-capped (20 MB / 5 MB) with a total call timeout and written atomically — a failed or oversized download can no longer destroy the working profile.
            - Profile metadata is written atomically with a backup copy; a corrupted store is recovered instead of silently wiping all subscription metadata.

            #### Fixed
            - Fixed a VPN stop/start race that could leave a ghost TUN interface, leak its file descriptor, and stick the state on RUNNING; fixed a foreground-service crash when tapping Start during a stop sequence (the start is now queued and honored after teardown).
            - Fixed the tunnel handing its IPv6 gateway to the core when the TUN's IPv6 address assignment failed — this caused "listen tcp6 … bind: cannot assign requested address" and dead tunnels on affected devices. The tunnel now runs IPv4-only in that case.
            - Fixed imported/downloaded profiles not appearing until an app restart (profile listing cache was never invalidated).
            - Fixed the Proxies screen freezing on data loaded at app start: LIST mode rendered expanded groups blank, non-selected groups in Tabs mode were empty, and the dashboard quick-node panel listed nothing after a cold start.
            - Fixed script rewrites being silently skipped: unroutable scripts now fall through to the engine (with a clear error) and unrecognized content logs a plain "unrecognized content" warning.
            - Bounded the DNS domain→IP cache (memory no longer grows indefinitely) and stopped polluting the DNS list with synthetic fake-IP entries from connection logs.
            - No update prompt when the installed version cannot be determined.

            #### Added
            - Full interface localization (简体中文 / English / Русский) with a language switch in Appearance; the switch now takes effect immediately across all screens.
            - Export logs to a file from the log screen via the system file picker; errors and warnings are also appended to a bounded on-disk file (diagnostic.log) so post-mortems survive a process death.
            - Repeated identical log messages collapse into a single entry with a repeat count (×N); while the screen is off, warnings are kept alongside errors (info/debug still dropped), so a boot-time VPN start no longer loses diagnostic warnings.

            #### Changed
            - The speed-test engine now lives in a ViewModel: rotating the screen no longer cancels in-flight group tests or wipes measured delays.
            - Once-per-second traffic updates no longer recompose the whole UI; speed-test results are applied in batches. Geo databases are extracted on a background thread at first launch.
            - Enabled R8 shrinking for release builds (release APK ~32 MB, about 24% smaller). The initial attempt crashed on real devices because the gomobile bridge looks up kotlinx.coroutines methods by name during JNI_OnLoad; an explicit keep rule fixes it (v1.0.4-Alpha.6 verified on device).
            - Unified visual specs across screens: colors now go through theme tokens, navigation-bar actions share one type/size spec, list row heights, divider indents, corner radii and empty states are consistent.
            - Upgraded Kotlin 2.1.0 → 2.4.10.
          draft: false
          prerelease: ${{ env.RELEASE_IS_PRERELEASE == 'true' }}
          files: build_output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
