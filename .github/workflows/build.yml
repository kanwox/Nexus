name: Nexus Build & Auto Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  # The quality gates must run on every proposed change, not only after it has
  # already landed on main. Without this trigger a broken change is only
  # discovered after it is merged — and the release job below would still
  # publish an artifact for it.
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions: {}

# A newer push supersedes an in-flight branch/PR build of the same ref. Tag
# pushes are excluded so a release publish workflow is never cancelled mid-run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # The quality gates run on every push, pull request, and merge group. This job
  # has NO write permission: it must never be able to publish anything.
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # AGP 9.4.1 targets build-tools 37.0.0 and compileSdk 37.
          #
          # NOTE the platform package id: from API 37 onwards the Android SDK uses
          # MINOR VERSIONED package names, so the platform is "platforms;android-37.0",
          # NOT "platforms;android-37" (which does not exist and makes sdkmanager fail
          # with "Failed to find package"). Build-tools keep the old naming scheme
          # ("build-tools;37.0.0").
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4

      # The repository tracks gradlew with the executable bit set (mode 100755), but a
      # checkout on a filesystem that does not preserve it (or a commit that accidentally
      # drops it) makes every ./gradlew call fail with "Permission denied" (exit code 126).
      # This step is the safety net for that case.
      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Toolchain versions
        run: |
          java -version
          ./gradlew --version

      # All gates must stay green; matches the local verification suite.
      # AGP 9.4.1 uses built-in Kotlin (without org.jetbrains.kotlin.android), so
      # Detekt 1.23.8 registers `:app:detekt` rather than variant `detektDebug`.
      - name: Static analysis (Detekt)
        run: ./gradlew detekt --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: UI token guard
        run: ./gradlew checkUiTokens --stacktrace

      - name: Compile AndroidTest sources
        run: ./gradlew compileDebugAndroidTestKotlin --stacktrace

  # Only runs after the quality gates passed, and ONLY on explicit version tags
  # so regular pushes to main or manual runs never overwrite an existing release.
  release:
    name: Build Android APK
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # See the note in the quality job: from API 37 the platform package id
          # carries the minor version ("platforms;android-37.0").
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4

      # See the note in the quality job: a lost executable bit makes ./gradlew fail with
      # "Permission denied" (exit code 126).
      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build_output
          # A missing release APK must fail the build. The previous fallback copied
          # the DEBUG apk into the release slot, which published an unsigned-by-release
          # artifact under a "release" name without any error.
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "::error::Release APK was not produced"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk build_output/Nexus-arm64-v8a-release.apk
          # Publish a checksum so a user can verify the downloaded artifact.
          sha256sum build_output/*.apk > build_output/SHA256SUMS
          ls -lh build_output

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Nexus-arm64-v8a-apk
          path: build_output/*

      - name: Extract App Version
        id: get_version
        run: |
          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          TAG="${{ github.ref_name }}"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=Nexus $TAG" >> "$GITHUB_ENV"
          # Any tag carrying a pre-release marker is published as a GitHub pre-release.
          if echo "$TAG" | grep -qiE -- '-(alpha|beta|rc|preview|canary|dev)([.#0-9-]|$)'; then
            echo "RELEASE_IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      # Release notes live in CHANGELOG.md (Keep a Changelog format). The workflow extracts
      # the section matching the current versionName literally so dots are never wildcards.
      - name: Extract Release Notes
        run: |
          mkdir -p build_output
          awk -v ver="$VERSION_NAME" '
            index($0, "## [" ver "]") == 1 { in_section = 1; next }
            in_section && index($0, "## [") == 1 { exit }
            in_section { print }
          ' CHANGELOG.md > build_output/release-notes.md
          if [ ! -s build_output/release-notes.md ]; then
            printf 'See CHANGELOG.md for the full release history.\n' > build_output/release-notes.md
          fi
          cat build_output/release-notes.md

      # Publishes the APK as a GitHub release for the version tag. Tags with a pre-release
      # marker (v1.0.4-Alpha.1, v1.0.1-Beta.2, v2.0.0-RC1, …) are marked as pre-releases.
      - name: Publish Automatic Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: build_output/release-notes.md
          draft: false
          prerelease: ${{ env.RELEASE_IS_PRERELEASE == 'true' }}
          files: build_output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
