name: Nexus Build & Auto Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  # The quality gates must run on every proposed change, not only after it has
  # already landed on main. Without this trigger a broken change is only
  # discovered after it is merged — and the release job below would still
  # publish an artifact for it.
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

# A newer push supersedes an in-flight build of the same ref. PR runs are
# grouped separately so a push to main does not cancel an open PR check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The four quality gates run on every push and pull request. This job has NO
  # write permission: it must never be able to publish anything.
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # AGP 9.4.1 targets build-tools 37.0.0 and compileSdk 37. platform-tools is
          # installed explicitly so AGP never has to reach the SDK manager at build time.
          packages: "platform-tools platforms;android-37 build-tools;37.0.0"

      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found (ANDROID_HOME=$ANDROID_HOME)" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # Explicit install as a safety net: AGP's own SDK download is disabled, so the
          # packages must exist before Gradle configures the project.
          "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0"
          "$SDKMANAGER" --list_installed | grep -E 'platform-tools|platforms;android-37|build-tools;37.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4

      - name: Toolchain versions
        run: |
          java -version
          ./gradlew --version

      # All four gates must stay green; they are also what CONTRIBUTING-level local
      # checks run (`./gradlew testDebugUnitTest detekt lintDebug checkUiTokens`).
      - name: Static analysis (detekt)
        run: ./gradlew detekt --no-configuration-cache --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-configuration-cache --stacktrace

      - name: Android lint
        run: ./gradlew lintDebug --no-configuration-cache --stacktrace

      - name: UI token guard
        run: ./gradlew checkUiTokens --no-configuration-cache --stacktrace

  # Only runs after the quality gates passed, and only for a release-worthy ref.
  release:
    name: Build Android APK
    needs: quality
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found (ANDROID_HOME=$ANDROID_HOME)" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build_output
          # A missing release APK must fail the build. The previous fallback copied
          # the DEBUG apk into the release slot, which published an unsigned-by-release
          # artifact under a "release" name without any error.
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "::error::Release APK was not produced"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk build_output/Nexus-arm64-v8a-release.apk
          # Publish a checksum so a user can verify the downloaded artifact.
          sha256sum build_output/*.apk > build_output/SHA256SUMS
          ls -lh build_output

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Nexus-arm64-v8a-apk
          path: build_output/*

      - name: Extract App Version
        id: get_version
        run: |
          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION_NAME}"
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=Nexus $TAG" >> "$GITHUB_ENV"
          # Any tag carrying a pre-release marker is published as a GitHub pre-release.
          if echo "$TAG" | grep -qiE -- '-(alpha|beta|rc|preview|canary|dev)([.#0-9-]|$)'; then
            echo "RELEASE_IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      # Release notes live in CHANGELOG.md (Keep a Changelog format). The workflow extracts
      # the section matching the current versionName, so a release body can never drift from
      # the code again. Bump versionName in app/build.gradle.kts and add the matching
      # "## [x.y.z]" section in the same commit.
      - name: Extract Release Notes
        run: |
          mkdir -p build_output
          awk -v ver="$VERSION_NAME" '
            $0 ~ "^## \\[" ver "\\]" { in_section = 1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > build_output/release-notes.md
          if [ ! -s build_output/release-notes.md ]; then
            printf 'See CHANGELOG.md for the full release history.\n' > build_output/release-notes.md
          fi
          cat build_output/release-notes.md

      # Publishes the APK as a GitHub release for the version tag. Tags with a pre-release
      # marker (v1.0.4-Alpha.1, v1.0.1-Beta.2, v2.0.0-RC1, …) are marked as pre-releases.
      - name: Publish Automatic Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: build_output/release-notes.md
          draft: false
          prerelease: ${{ env.RELEASE_IS_PRERELEASE == 'true' }}
          files: build_output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
