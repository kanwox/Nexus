name: Nexus Build & Auto Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # detekt fails the build on any issue (ignoreFailures = false in app/build.gradle.kts),
      # so this gate is meaningful.
      - name: Static analysis (detekt)
        run: ./gradlew detekt --no-configuration-cache

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-configuration-cache

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build_output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build_output/Nexus-arm64-v8a-release.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build_output/Nexus-arm64-v8a-debug.apk
          else
            find app/build/outputs/apk -name "*.apk" -exec cp {} build_output/ \;
          fi
          ls -lh build_output

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-arm64-v8a-apk
          path: build_output/*.apk

      - name: Extract App Version
        id: get_version
        run: |
          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION_NAME}"
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=Nexus $TAG" >> "$GITHUB_ENV"
          # Any tag carrying a pre-release marker is published as a GitHub pre-release.
          if echo "$TAG" | grep -qiE -- '-(alpha|beta|rc|preview|canary|dev)([.#0-9-]|$)'; then
            echo "RELEASE_IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      # Publishes the APK as a GitHub release for the version tag. Tags with a pre-release
      # marker (v1.0.4-Alpha.1, v1.0.1-Beta.2, v2.0.0-RC1, …) are marked as pre-releases.
      - name: Publish Automatic Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body: |
            ### Changes in v1.0.4-Alpha.6

            #### Fixed
            - Fixed the v1.0.4-Alpha.5 startup crash on real devices: the gomobile bridge library looks up kotlinx.coroutines methods by name during JNI_OnLoad, and R8 shrinking had stripped them. An explicit keep rule now covers the whole coroutines package, and R8 shrinking stays enabled (release APK ~32 MB, about 24% smaller).
          draft: false
          prerelease: ${{ env.RELEASE_IS_PRERELEASE == 'true' }}
          files: build_output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
