name: Nexus Build & Auto Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # detekt fails the build on any issue (ignoreFailures = false in app/build.gradle.kts),
      # so this gate is meaningful.
      - name: Static analysis (detekt)
        run: ./gradlew detekt --no-configuration-cache

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-configuration-cache

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build_output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build_output/Nexus-arm64-v8a-release.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build_output/Nexus-arm64-v8a-debug.apk
          else
            find app/build/outputs/apk -name "*.apk" -exec cp {} build_output/ \;
          fi
          ls -lh build_output

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-arm64-v8a-apk
          path: build_output/*.apk

      - name: Extract App Version
        id: get_version
        run: |
          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION_NAME}"
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=Nexus $TAG" >> "$GITHUB_ENV"
          # Any tag carrying a pre-release marker is published as a GitHub pre-release.
          if echo "$TAG" | grep -qiE -- '-(alpha|beta|rc|preview|canary|dev)([.#0-9-]|$)'; then
            echo "RELEASE_IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      # Publishes the APK as a GitHub release for the version tag. Tags with a pre-release
      # marker (v1.0.4-Alpha.1, v1.0.1-Beta.2, v2.0.0-RC1, …) are marked as pre-releases.
      - name: Publish Automatic Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body: |
            ### Changes in v1.0.4-Alpha.3

            #### Fixed
            - **Imported/downloaded profiles did not appear in the profile list until the app was restarted.** The in-memory profile listing was never dropped after a metadata save, so every import (file or subscription) stayed invisible for the whole process lifetime. The cache is now invalidated on every store write.
            - Debug builds on an emulator skip native core initialization (the Go core cannot run under ARM translation), which makes the whole UI/config/script pipeline testable on emulators. Release builds and real devices are unaffected.

            ### Changes in v1.0.4-Alpha.2

            #### Fixed (regressions in v1.0.4-Alpha.1)
            - **Config rewrite scripts were silently disabled for most script styles.** The new QuickJS engine evaluated user scripts expecting a Unit completion value; any script whose last statement produces a value (e.g. `module.exports = ...`) failed with a type-converter error and was skipped — so existing profiles lost their rewrites, displayed the raw (unmodified) groups and misbehaved. Scripts are now evaluated without a completion-value constraint; all common styles (`function main`, `module.exports =`, arrow-function `main`, `exports.main`) are covered by engine tests.
            - JS detection accepted only `main(...)` call syntax; `main = (config) => ...` and other definition styles were misrouted to the YAML merger and ignored. Detection now covers definition, assignment and export styles (still without misfiring on YAML like "maintain").
            - Local file import read the picked URI through the application context, which some file providers deny; it now uses the picker-launching activity context again.
            - Subscription/script downloads crashed on chunked (Content-Length-less) responses with a negative buffer size — fixed and covered by a test.

            ### Changes in v1.0.4-Alpha.1

            #### Security
            - Pinned SHA-256 fingerprints for config rewrite scripts. Scripts are verified before auto-execution and skipped with a warning if the on-disk content or a re-downloaded remote payload no longer matches what was saved.
            - Replaced the unmaintained QuickJS engine with quickjs-kt. Script timeouts are now enforced by a native interrupt handler, so an infinite-loop script is terminated cleanly instead of leaking a spinning thread and unbounded memory.
            - Subscription and script URLs are redacted in logs and error messages (tokens stripped), and link-local (cloud metadata) targets are rejected.
            - Subscription and script downloads are size-capped (20 MB / 5 MB) with a total call timeout, and written atomically — a failed or oversized download can no longer destroy the working profile.
            - Improved JS/YAML script detection: YAML containing words like "maintain" is no longer misrouted into the JS engine.

            #### Fixed
            - Fixed a VPN stop/start race that could leave a ghost TUN interface, leak its file descriptor, and stick the state on RUNNING.
            - Fixed a foreground-service crash when tapping Start during a stop sequence (the start is now queued and honored after teardown).
            - Profile metadata is written atomically with a backup copy; a corrupted store is recovered instead of silently wiping all subscription metadata.
            - Bounded the DNS domain→IP cache (memory no longer grows indefinitely on long VPN sessions) and stopped polluting the DNS list with synthetic fake-IP entries from connection logs.
            - Fixed list keys causing full node-list rebuilds while searching or delay-sorting; fixed the segmented control wrongly highlighting the first item when the saved selection is no longer in the list.
            - No update prompt when the installed version cannot be determined.

            #### Changed
            - The speed-test engine now lives in a ViewModel: rotating the screen no longer cancels in-flight group tests or wipes measured delays.
            - Once-per-second traffic updates no longer recompose the whole UI; recomposition is scoped to the traffic cards and collection is lifecycle-aware.
            - Speed-test results are applied in batches (one recomposition per frame instead of one per node).
            - Geo databases are extracted on a background thread at first launch.
            - Upgraded Kotlin 2.1.0 → 2.4.10.
            - R8 keep rules prepared for a future minified release; shrinking stays off until verified on a real device.
          draft: false
          prerelease: ${{ env.RELEASE_IS_PRERELEASE == 'true' }}
          files: build_output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
