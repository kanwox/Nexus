org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Reproducible SDK provisioning: CI (and developers) install the exact packages up front.
# AGP otherwise contacts the SDK manager during configuration, and a flaky manifest fetch
# ("IO exception while downloading manifest") aborts the whole build before any task runs.
android.builder.sdkDownload=false

# More patient metadata resolution on CI networks.
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=500
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000

# 本机离线构建：JDK 21 来自 E:\AndroidEnv，依赖缓存在 E:\gradle-home（配 --offline 使用）。
# 系统 JAVA_HOME 指向已删除的旧路径，gradlew.bat 启动时仍会读它，这里钉死覆盖。
org.gradle.java.home=E\:\\AndroidEnv\\jdk\\jdk-21.0.11+10
